<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业排污许可与超标处置</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#17212b}pre{background:#f4f7f9;padding:1rem;overflow:auto}button{padding:.55rem 1rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #d8e0e6;padding:.4rem .6rem;text-align:left;font-size:.9rem}th{background:#f4f7f9}</style></head><body><h1>企业排污许可与超标处置</h1><p>汇总监测和工况，判断排放超标并跟踪复测、整改、执法与复查</p><p>事件进入评估后由合规员按当前版本领单，同一事件只留一名领办人；转交需写明原因并经接收人确认。列表展示领办人、待确认交接与版本。</p><button onclick="loadItems()">刷新队列</button><pre id="out">使用X-Actor和X-Role请求头调用接口。</pre><script>
async function loadItems(){
  const r=await fetch('/api/items',{headers:{'X-Actor':'demo','X-Role':'viewer'}});
  const data=await r.json();
  const rows=(data.items||[]).map(i=>{
    const h=i.pending_handoff?`${i.pending_handoff.from_owner} → ${i.pending_handoff.to_actor}（${i.pending_handoff.reason}）`:'';
    return {id:i.id,title:i.title,status:i.status,version:i.version,owner:i.owner||'（未领办）',pending_handoff:h||'-'};
  });
  document.getElementById('out').textContent=JSON.stringify(rows,null,2);
}
</script></body></html>
